# Nginx front end for the end-to-end stack (see docker/docker-compose.yml).
# The FastCGI cache zone lives in a named volume shared with the WordPress
# container, so the plugin can purge it from PHP.

upstream php {
    server wordpress:9000;
}

fastcgi_cache_path /var/cache/nginx/wordpress levels=1:2 keys_zone=icc_gg_super_cache:100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        set $icc_gg_skip_cache 0;
        if ($request_method = POST) { set $icc_gg_skip_cache 1; }
        if ($query_string != "") { set $icc_gg_skip_cache 1; }
        if ($http_cookie ~* "comment_author|wordpress_|wp-postpass_|wordpress_logged_in_") {
            set $icc_gg_skip_cache 1;
        }

        fastcgi_cache icc_gg_super_cache;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_bypass $icc_gg_skip_cache;
        fastcgi_no_cache $icc_gg_skip_cache;
        add_header X-FastCGI-Cache $upstream_cache_status;
    }

    location ~ /\.ht {
        deny all;
    }
}
