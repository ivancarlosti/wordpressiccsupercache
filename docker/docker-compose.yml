name: icc-gg-super-cache-e2e

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-fpm-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_CACHE', true );
        define( 'ICC_GG_SUPER_CACHE_ALLOW_WP_CONFIG_EDIT', false );
        define( 'ICC_GG_SUPER_CACHE_VARNISH_HOST', 'varnish' );
        define( 'ICC_GG_SUPER_CACHE_VARNISH_PORT', 80 );
        define( 'ICC_GG_SUPER_CACHE_VARNISH_KEY', 'dev-purge-key' );
        define( 'WP_DEBUG_LOG', '/var/www/html/wp-content/debug.log' );
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/icc-gg-wordpress-super-cache
      - ../tests/e2e/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - nginx_cache:/var/cache/nginx/wordpress

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - wordpress:/var/www/html:ro
      - ../tests/e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx/wordpress

  varnish:
    image: varnish:7.5-alpine
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      VARNISH_SIZE: 64M
    ports:
      - "${VARNISH_PORT:-6081}:80"
    volumes:
      - ../tests/e2e/varnish.vcl:/etc/varnish/default.vcl:ro

  # Creates the Nginx cache zone with permissive ownership so both the Nginx
  # worker and PHP-FPM can use it. Development convenience only.
  nginx-cache-init:
    image: alpine:3
    command: ["sh", "-c", "mkdir -p /var/cache/nginx/wordpress && chmod -R 0777 /var/cache/nginx/wordpress"]
    volumes:
      - nginx_cache:/var/cache/nginx/wordpress

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    user: "82:82"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/icc-gg-wordpress-super-cache

volumes:
  db:
  wordpress:
  nginx_cache:
